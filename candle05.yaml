# Battery candle 05. Everything shared is in candle/ (start with candle/candle.yaml).
substitutions:
  dev_name: candle05
  dev_friendly_name: Candle 05

packages:
  candle: !include candle/candle.yaml

# Network: DHCP by default (a DHCP reservation on the router keeps the address fixed).
# For a static IP instead, uncomment and use a free address outside the DHCP pool; it also saves the
# ~1 s DHCP takes on each wake on the IoT VLAN.
# wifi:
#   manual_ip:
#     static_ip: 192.168.2.xxx
#     gateway: 192.168.2.1
#     subnet: 255.255.255.0
#     dns1: 192.168.2.1
