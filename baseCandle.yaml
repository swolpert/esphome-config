---
wifi:
  # https://esphome.io/components/wifi
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  use_address: "${dev_use_address}"
  fast_connect: true
  # DHCP (static IPs are hard to manage on the VLAN). For a stable address, use a DHCP
  # reservation on the router. The candle publishes its current IP in ${dev_name}/waketime.
  # manual_ip:
  #   static_ip: ${dev_static_ip}
  #   gateway: 192.168.2.1
  #   subnet: 255.255.255.0
  #   dns1: 192.168.2.1
  #   dns2: 8.8.8.8

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "${dev_name} Fallback Hotspot"
    password: !secret wifi_fallback_ap_password

safe_mode:
  disabled: true

captive_portal:
  # no configuration needed
  # https://esphome.io/components/captive_portal.html

# Enable logging
logger:
  # https://esphome.io/components/logger
  # INFO: skips the per-wake config dump and DEBUG chatter (faster wakes on battery candles)
  level: INFO
  # level: DEBUG
  # level: VERBOSE
  # level: VERY_VERBOSE
  baud_rate: 115200
  hardware_uart: UART0

ota:
  - platform: esphome
    # password: !secret ota_password
# # To remove ota password...
    # password: "OLD_OTA_PASSWORD"  # put the previous OTA password here
    # id: ota_id

# Enable Web server.
web_server:
  port: 80
  version: 2
#  auth:
#    username: !secret web_server_username
#    password: !secret web_server_password

#mqtt:
#  broker: !secret mqtt_broker
#  username: !secret mqtt_username
#  password: !secret mqtt_password
#  port: !secret mqtt_port
#  # Set to true when finished testing to set MQTT retain flag
#  discovery_retain: false


