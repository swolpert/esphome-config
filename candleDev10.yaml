          esp_deep_sleep_disable_rom_logging();  // no ESP-ROM banner on next wake (~30ms at 115200)
          id(deep_sleep1).allow_deep_sleep();
          id(deep_sleep1).set_run_duration(0);
          id(deep_sleep1).set_sleep_duration(candle::begin_sleep_ms(id(planned_sleep_s) * 1000LL));
          id(deep_sleep1).begin_sleep();
